<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация — iomaenglish</title>
<link rel="stylesheet" href="/styles.css">
</head><body>
<div class="auth-page"><div class="auth-card">
<a href="/" class="auth-back">← На главную</a>
<h1>Создать аккаунт</h1>
<p class="auth-sub">Зарегистрируйтесь — прогресс сохранится навсегда.</p>
<form id="f">
<label class="auth-field"><span>Имя</span><input type="text" id="name" placeholder="Как к вам обращаться"></label>
<label class="auth-field"><span>Email</span><input type="email" id="email" required></label>
<label class="auth-field"><span>Пароль (минимум 6 символов)</span><input type="password" id="password" required minlength="6"></label>
<button type="submit" class="btn-primary auth-submit" id="b">Зарегистрироваться</button>
<div class="auth-error" id="err" hidden></div>
</form>
<div class="auth-hint">Уже есть аккаунт? <a href="/login">Войти</a></div>
</div></div>
<script>
(function(){
var f=document.getElementById('f'),err=document.getElementById('err'),b=document.getElementById('b');
f.addEventListener('submit',function(e){
e.preventDefault();err.hidden=true;
var name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
if(!email||!password)return err.hidden=false,err.textContent='Заполните email и пароль';
if(password.length<6)return err.hidden=false,err.textContent='Пароль минимум 6 символов';
b.disabled=true;b.textContent='Создаём...';
fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({name:name,email:email,password:password})})
.then(function(r){return r.json();})
.then(function(d){b.disabled=false;b.textContent='Зарегистрироваться';if(d&&d.ok)location.href='/profile';else{err.hidden=false;err.textContent=(d&&d.error)||'Ошибка';}})
.catch(function(){b.disabled=false;b.textContent='Зарегистрироваться';err.hidden=false;err.textContent='Ошибка соединения';});
});
})();
</script>
<script src="/tts.js?v=2" defer></script>
<script src="/interactions.js?v=3" defer></script>
<script src="/robot.js?v=10" defer></script>
</body></html>

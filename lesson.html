<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson — iomaenglish</title>
<link rel="stylesheet" href="/styles.css?v=20">
<link rel="stylesheet" href="/lesson.css?v=3">
</head>
<body>
<header class="topbar">
  <div class="topbar-left"><a href="/dashboard" class="back-link">← Dashboard</a></div>
  <div class="brand">ioma<span>english</span></div>
  <div class="topbar-right">
    <button id="themeToggle" class="theme-btn" aria-label="Theme"><svg viewBox="0 0 24 24"><g class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g><path class="icon-moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>
<main class="lesson-shell">
  <div class="lesson-header">
    <div class="lh-eyebrow" id="lessonEyebrow">Lesson</div>
    <h1 id="lessonTitle">Loading...</h1>
    <div class="lh-book" id="lessonBook"></div>
  </div>
  <section class="lesson-rule">
    <h2>Theory</h2>
    <p id="lessonGrammar">...</p>
  </section>
  <section class="lesson-exercises">
    <h2>Practice</h2>
    <div class="progress-line"><div class="pl-bar"><div class="pl-fill" id="plFill" style="width:0%"></div></div><span id="plText">0 / 0</span></div>
    <div id="exerciseHost"></div>
  </section>
  <div class="lesson-nav">
    <button class="btn-ghost" id="backBtn">← Назад</button>
    <button class="btn-primary" id="nextBtn" disabled>Проверить</button>
  </div>
  <section class="lesson-result" id="lessonResult" hidden>
    <div class="lr-card">
      <div class="lr-icon">✓</div>
      <h2 id="lrTitle">Lesson complete</h2>
      <p class="lr-score" id="lrScore"></p>
      <div class="lr-actions">
        <a href="/dashboard" class="btn-primary">К дашборду</a>
        <button class="btn-ghost" id="againBtn">Пройти снова</button>
      </div>
    </div>
  </section>
</main>
<script src="/lesson.js?v=3" defer></script>
<script src="/tts.js?v=2" defer></script>
<script src="/interactions.js?v=3" defer></script>
<script src="/robot.js?v=10" defer></script>
</body>
</html>

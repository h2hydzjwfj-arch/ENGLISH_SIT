<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening — iomaenglish</title>
<link rel="stylesheet" href="/styles.css?v=20">
<link rel="stylesheet" href="/listening.css?v=3">
</head>
<body>
<header class="topbar">
  <div class="topbar-left"><a href="/dashboard" class="back-link">← Dashboard</a></div>
  <div class="brand">ioma<span>english</span></div>
  <div class="topbar-right"><button id="themeToggle" class="theme-btn" aria-label="Theme"><svg viewBox="0 0 24 24"><g class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g><path class="icon-moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
</header>
<main class="lst-shell">
  <div class="lst-head">
    <div class="lh-eyebrow">Listening Lab</div>
    <h1>Аудирование</h1>
    <p>Слушайте аудио, пишите транскрипт. AI проверит точность восприятия на слух.</p>
  </div>
  <div class="lst-card">
    <div class="lst-meta"><span id="lstLevel">A2</span><span id="lstCounter">1 / 5</span></div>
    <div class="lst-title" id="lstTitle"></div>
    <div class="lst-controls">
      <button class="lst-play" id="playBtn"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z" fill="currentColor"/></svg><span>Слушать</span></button>
      <button class="lst-slow" id="slowBtn">Медленно</button>
    </div>
    <div class="lst-input">
      <label>What did you hear?</label>
      <textarea id="lstAnswer" rows="4" placeholder="Пишите на английском..." maxlength="600"></textarea>
      <div class="lst-actions">
        <button class="btn-ghost" id="revealBtn">Показать оригинал</button>
        <button class="btn-primary" id="checkLstBtn">Проверить</button>
      </div>
    </div>
    <div class="lst-original" id="lstOriginal" hidden><div class="lo-label">Original</div><div class="lo-text" id="loText"></div></div>
    <div class="lst-result" id="lstResult" hidden></div>
    <div class="lst-nav">
      <button class="btn-ghost" id="prevLst" disabled>← Назад</button>
      <button class="btn-primary" id="nextLst" disabled>Далее →</button>
    </div>
  </div>
</main>
<script src="/listening.js?v=3" defer></script>
<script src="/tts.js?v=2" defer></script>
<script src="/interactions.js?v=3" defer></script>
<script src="/robot.js?v=10" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<script>
(function(){try{
  var t=localStorage.getItem('iomaeng_theme');
  if(t==='light')document.documentElement.classList.add('light');
  else if(t==='dark')document.documentElement.classList.remove('light');
  else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.classList.add('light');
}catch(e){}})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing — iomaenglish</title>
<link rel="stylesheet" href="/styles.css?v=20">
<link rel="stylesheet" href="/writing.css?v=3">
</head>
<body>
<header class="topbar">
  <div class="topbar-left"><a href="/dashboard" class="back-link">← Dashboard</a></div>
  <div class="brand">ioma<span>english</span></div>
  <div class="topbar-right"><button id="themeToggle" class="theme-btn" aria-label="Theme"><svg viewBox="0 0 24 24"><g class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g><path class="icon-moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
</header>
<main class="wrt-shell">
  <div class="wrt-head">
    <div class="wh-eyebrow">Writing Lab</div>
    <h1>Практика письма</h1>
    <p>Пишите эссе или текст. AI оценит по 4 критериям Cambridge: Task, Coherence, Vocabulary, Grammar.</p>
  </div>
  <div class="wrt-task" id="wrtTask">
    <div class="wt-label">Task</div>
    <div class="wt-text" id="wtText">Loading...</div>
    <button class="wt-new" id="newTaskBtn">Другое задание</button>
  </div>
  <div class="wrt-editor">
    <textarea id="wrtInput" placeholder="Начните писать на английском..." maxlength="3000" rows="14"></textarea>
    <div class="wrt-meta"><span id="wrtCount">0 слов · 0 знаков</span></div>
  </div>
  <div class="wrt-actions">
    <button class="btn-primary" id="checkWritingBtn" disabled>Проверить с AI</button>
    <span class="wrt-hint">Занимает 10–30 секунд</span>
  </div>
  <div class="wrt-result" id="wrtResult" hidden></div>
</main>
<script src="/writing.js?v=3" defer></script>
<script src="/tts.js?v=2" defer></script>
<script src="/interactions.js?v=3" defer></script>
<script src="/robot.js?v=10" defer></script>
<script src="/theme.js" defer></script>
</body>
</html>

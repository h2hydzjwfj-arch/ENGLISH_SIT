<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — iomaenglish</title>
<link rel="stylesheet" href="/styles.css">
</head><body>
<div class="auth-page"><div class="auth-card">
<a href="/" class="auth-back">← На главную</a>
<h1>Вход в аккаунт</h1>
<p class="auth-sub">Войдите, чтобы сохранить прогресс.</p>
<form id="f">
<label class="auth-field"><span>Email</span><input type="email" id="email" required></label>
<label class="auth-field"><span>Пароль</span><input type="password" id="password" required></label>
<button type="submit" class="btn-primary auth-submit" id="b">Войти</button>
<div class="auth-error" id="err" hidden></div>
</form>
<div class="auth-hint">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
</div></div>
<script>
(function(){
var f=document.getElementById('f'),err=document.getElementById('err'),b=document.getElementById('b');
f.addEventListener('submit',function(e){
e.preventDefault();err.hidden=true;
var email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
if(!email||!password)return err.hidden=false,err.textContent='Заполните все поля';
b.disabled=true;b.textContent='Вход...';
fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:email,password:password})})
.then(function(r){return r.json();})
.then(function(d){b.disabled=false;b.textContent='Войти';if(d&&d.ok)location.href='/profile';else{err.hidden=false;err.textContent=(d&&d.error)||'Ошибка входа';}})
.catch(function(){b.disabled=false;b.textContent='Войти';err.hidden=false;err.textContent='Ошибка соединения';});
});
})();
</script>
<script src="/tts.js?v=2" defer></script>
<script src="/interactions.js?v=3" defer></script>
<script src="/robot.js?v=10" defer></script>
</body></html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary — iomaenglish</title>
<link rel="stylesheet" href="/styles.css?v=20">
<link rel="stylesheet" href="/vocabulary.css?v=3">
</head>
<body>
<header class="topbar">
  <div class="topbar-left"><a href="/dashboard" class="back-link">← Dashboard</a></div>
  <div class="brand">ioma<span>english</span></div>
  <div class="topbar-right"><button id="themeToggle" class="theme-btn" aria-label="Theme"><svg viewBox="0 0 24 24"><g class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g><path class="icon-moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
</header>
<main class="voc-shell">
  <div class="voc-head">
    <div class="vh-eyebrow">Vocabulary</div>
    <h1>Словарь</h1>
    <p>Слова с интервальным повторением — запоминаются навсегда.</p>
  </div>
  <div class="voc-stats">
    <div class="vs-card"><div class="vs-value" id="vsTotal">0</div><div class="vs-label">All words</div></div>
    <div class="vs-card"><div class="vs-value" id="vsDue">0</div><div class="vs-label">Due now</div></div>
  </div>
  <section class="voc-add">
    <h2>Add word</h2>
    <div class="va-row">
      <input id="wordInput" placeholder="Word (English)" autocomplete="off">
      <input id="transInput" placeholder="Перевод (русский)" autocomplete="off">
      <button class="btn-primary" id="addWordBtn">Добавить</button>
    </div>
  </section>
  <section class="voc-review"><h2>Review</h2><div id="reviewHost"></div></section>
  <section class="voc-list"><h2>My words</h2><div id="listHost"></div></section>
</main>
<script src="/vocabulary.js?v=3" defer></script>
<script src="/tts.js?v=2" defer></script>
<script src="/interactions.js?v=3" defer></script>
<script src="/robot.js?v=10" defer></script>
</body>
</html>
